[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc2-cpg-agent"
version = "0.1.0"
description = "Deterministic phase-1 CPG analysis agent demo"
requires-python = ">=3.11"

[project.scripts]
rc2-cpg-agent = "rc2_cpg_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

